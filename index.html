<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- ── Favicon ─────────────────────────────────────── -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="theme-color" content="#0b1220" />

    <!-- ── Primary Meta (overridden per-page by SEOHead) ─ -->
    <title>White Mask Content — Done-for-You Faceless AI Video Production</title>
    <meta
      name="description"
      content="White Mask Content turns one idea into a full faceless video pipeline: scripts, AI voiceover, editing, thumbnails, and posting for creators, startups, and YouTube channels. Plans from $54/mo."
    />
    <link rel="canonical" href="https://www.whitemaskcontent.com/" />

    <!-- ── Open Graph ──────────────────────────────────── -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="White Mask Content" />
    <meta property="og:title" content="White Mask Content — Done-for-You Faceless AI Video Production" />
    <meta
      property="og:description"
      content="Scripts, AI voiceover, editing, thumbnails, and posting — handled. Faceless video plans from $54/mo for creators, startups, and YouTube channels."
    />
    <meta property="og:url" content="https://www.whitemaskcontent.com/" />
    <meta property="og:image" content="https://www.whitemaskcontent.com/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <!-- ── Twitter Card ────────────────────────────────── -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="White Mask Content — Done-for-You Faceless AI Video Production" />
    <meta
      name="twitter:description"
      content="Scripts, AI voiceover, editing, thumbnails, and posting — handled. Faceless video plans from $54/mo."
    />
    <meta name="twitter:image" content="https://www.whitemaskcontent.com/og-image.png" />

    <!-- ── Additional SEO meta ─────────────────────────── -->
    <meta name="robots" content="index, follow" />
    <meta name="author" content="White Mask Content" />
    <meta
      name="keywords"
      content="faceless video production, AI video, YouTube automation, faceless YouTube channel, done-for-you video, AI voiceover, video editing service, YouTube content creation, faceless content, video production agency"
    />

    <!-- ── JSON-LD: Organization ───────────────────────── -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "White Mask Content",
        "url": "https://www.whitemaskcontent.com",
        "logo": "https://www.whitemaskcontent.com/favicon.svg",
        "description": "Done-for-you faceless AI video production for creators, startups, and YouTube channels. Scripts to posting, handled.",
        "contactPoint": {
          "@type": "ContactPoint",
          "contactType": "sales",
          "availableLanguage": "English"
        }
      }
    </script>

    <!-- ── JSON-LD: WebSite ────────────────────────────── -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "White Mask Content",
        "url": "https://www.whitemaskcontent.com"
      }
    </script>

    <!-- ── Fonts ───────────────────────────────────────── -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,200..800&family=Hanken+Grotesk:ital,wght@0,400..800;1,400..800&display=swap"
      rel="stylesheet"
    />

    <!-- ── SPA redirect handler (GitHub Pages) ─────────── -->
    <!-- Works with public/404.html to restore BrowserRouter paths -->
    <script>
      (function (l) {
        if (l.search[1] === '/') {
          var decoded = l.search
            .slice(1)
            .split('&')
            .map(function (s) {
              return s.replace(/~and~/g, '&');
            })
            .join('?');
          window.history.replaceState(null, null, l.pathname.slice(0, -1) + decoded + l.hash);
        }
      })(window.location);
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
