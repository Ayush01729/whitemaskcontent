    <!-- ── Fonts ───────────────────────────────────────── -->

      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,200..800&family=Hanken+Grotesk:ital,wght@0,400..800;1,400..800&display=swap"
      rel="stylesheet"
    />

    <!-- ── SPA redirect handler (GitHub Pages) ─────────── -->
    <!-- Works with public/404.html to restore BrowserRouter paths -->
    <script>
      (function (l) {
        if (l.search[1] === '/') {
          var decoded = l.search
            .slice(1)
            .split('&')
            .map(function (s) {
              return s.replace(/~and~/g, '&');
            })
            .join('?');
          window.history.replaceState(null, null, l.pathname.slice(0, -1) + decoded + l.hash);
        }
      })(window.location);
    </script>
